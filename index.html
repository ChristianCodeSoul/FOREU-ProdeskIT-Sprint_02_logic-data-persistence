<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="metaDescription" content="">
    <meta name="theme-color" id="metaThemeColor" content="">
    <title></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" 
    rel="stylesheet"
    media="print"
    onload="this.media='all'">

    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" 
        rel="stylesheet">
    </noscript>
    <script type="application/json" id="siteConfig">
        {"theme":{"validThemes":["dark", "grey", "light"], "legacyKeys":["foreu-theme", "prodesk-theme"], "default": "dark", "themeColor": "#090d16"}}
    </script>

    <script>
        (() => {
            'use strict';
            const STORAGE_KEY = 'foreu-site-state';
            const VALID_THEMES = new Set(['dark', 'grey', 'light']);
            try {
                const rawState = localStorage.getItem(STORAGE_KEY);
                if (!rawState) return;
                const savedState = JSON.parse(rawState);
                const theme = savedState?.theme;
                if (VALID_THEMES.has(theme)) {
                    document.documentElement.dataset.theme = theme;
                }
            } catch {

            }
        })();
    </script>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/pubsub.js"></script>
    <script defer src="js/main.js"></script>
</head>


<body>
    <div id="siteLoading" class="site-loading" role="status" aria-live="polite" aria-hidden="false">
        <div class="site-loading__inner">
            <div class="site-loading__spinner" aria-hidden="true">
                <p id="siteLoadingText"></p>
            </div>
        </div>
    </div>

    <div id="siteError" class="site-error" role="alertdialog" aria-hidden="true">
        <div class="site-error__card">
            <p id="siteErrorMessage"></p>
            <div class="site-error__actions">
                <button id="siteErrorRetry" class="button"></button>
            </div>
        </div>
    </div>

    <div class="cursor" id="cursorRing" aria-hidden="true"></div>

    <header class="header">
        <div class="layout-container header__container">
            <a href="#" id="logoLinkHeader" class="header__logo" aria-label="">
                <img id="logoImgHeader" src="images/logo.webp" alt="" class="header__logo-img" width="48" height="64">
                <span class="header__logo-text" id="brandName"></span>
            </a>
            <div class="header__controls">
                <div class="theme-switcher" role="group" id="themeSwitcher" aria-label="">
                    <button class="theme-switcher__button theme-switcher__button--active" data-set-theme="dark" aria-label="" aria-pressed="true">
                        <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button  class="theme-switcher__button" data-set-theme="grey" aria-label="" aria-pressed="false">
                        <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button class="theme-switcher__button" data-set-theme="light" aria-label="" aria-pressed="false">
                        <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="5"/>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                        </svg>
                    </button>
                </div>
                <div class="nav-menu">
                    <button class="nav-menu__toggle" id="menuButton" aria-label="" aria-expanded="false">
                        <span class="nav-menu__line" aria-hidden="true"></span>
                        <span class="nav-menu__line" aria-hidden="true"></span>
                        <span class="nav-menu__line" aria-hidden="true"></span>
                    </button>
                    <ul class="nav-menu__dropdown" id="navDropdown"></ul>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero" id="solutions">
            <div class="layout-container hero__grid">
                <div class="hero__content">
                    <h1 class="hero__title">
                        <span id="heroTitlePrefix"></span>
                        <span class="hero__word-container">
                            <span class="hero__dynamic-word" id="dynamicWord"></span>
                        </span>
                    </h1>
                    <p class="hero__subtitle hero__subtitle--gradient" id="heroSubtitle"></p>
                    <div class="hero__actions">
                        <a id="heroActionPrimary" class="button button--primary" aria-label=""></a>
                        <a id="heroActionSecondary" class="button button--secondary" aria-label=""></a>
                    </div>
                </div>
                <div class="hero__graphic-wrapper">
                    <svg id="heroDiagram" class="hero__svg" viewBox="0 0 450 300" width="28.125rem" height="18.75rem" aria-label="">
                        <rect id="node1" class="hero__svg-node hero__svg-node--one" x="50" y="40" width="180" height="120" rx="16" fill="var(--primary)" fill-opacity="0.15" stroke="var(--primary)" stroke-width="2"/>
                        <rect id="node2" class="hero__svg-node hero__svg-node--two" x="220" y="100" width="220" height="140" rx="16" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
                        <circle id="node3" class="hero__svg-node hero__svg-node--three" cx="140" cy="100" r="25" fill="var(--primary)" fill-opacity="0.4"/>
                        <path id="connector" class="hero__svg-connector" d="M120 220 L 260 160" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>
                    </svg>
                </div>
            </div>
        </section>
        <section class="features" id="features">
            <div class="layout-container">
                <h2 class="features__title motion-reveal"></h2>
                <div class="features__grid">
                    <article class="feature-card feature-card--delay-1 motion-reveal">
                        <div class="feature-card__image-wrapper">
                            <img alt="" class="feature-card__img" loading="lazy" width="800" height="450">
                        </div>
                        <div class="feature-card__content">
                            <div class="feature-card__icon" aria-hidden="true">
                                <svg width="1.5rem" height="1.5rem" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
                                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                                </svg>
                            </div>
                            <h3 class="feature-card__title"></h3>
                            <p class="feature-card__description"></p>
                        </div>
                    </article>

                    <article class="feature-card feature-card--delay-2 motion-reveal">
                        <div class="feature-card__image-wrapper">
                            <img alt="" class="feature-card__img" loading="lazy" width="800" height="450">
                        </div>
                        <div class="feature-card__content">
                            <div class="feature-card__icon" aria-hidden="true">
                                <svg width="1.5rem" height="1.5rem" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                </svg>
                            </div>
                            <h3 class="feature-card__title"></h3>
                            <p class="feature-card__description"></p>
                        </div>
                    </article>

                    <article class="feature-card feature-card--delay-3 motion-reveal">
                        <div class="feature-card__image-wrapper">
                            <img alt="" class="feature-card__img" loading="lazy" width="800" height="450">
                        </div>
                        <div class="feature-card__content">
                            <div class="feature-card__icon" aria-hidden="true">
                                <svg width="1.5rem" height="1.5rem" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
                                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                                </svg>
                            </div>
                            <h3 class="feature-card__title"></h3>
                            <p class="feature-card__description"></p>
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section class="services-network" id="services">
            <div class="layout-container services-network__container">
                <div class="services-network__intro">
                    <span class="services-network__eyebrow" id="servicesIntroEyebrow"></span>
                    <h2 class="services-network__title" id="servicesIntroTitle"></h2>
                    <p class="services-network__description" id="servicesIntroDescription"></p>
                </div>
                <div class="services-network__group">
                    <div class="services-network__group-heading">
                        <span class="services-network__group-number" id="servicesGroup1Number"></span>
                        <h3 class="services-network__group-title" id="servicesGroup1Title"></h3>
                    </div>
                    <div class="services-network__orbit" id="servicesList1"></div>
                </div>
                <div class="services-network__group services-network__group--capabilities">
                    <div class="services-network__group-heading">
                        <span class="services-network__group-number" id="servicesGroup2Number"></span>
                        <h3 class="services-network__group-title" id="servicesGroup2Title"></h3>
                    </div>
                    <div class="services-network__orbit" id="servicesList2"></div>
                </div>
            </div>
        </section>

        <section class="contact motion-reveal" id="contact">
            <div class="layout-container">
                <div class="contact__box surface-card">
                    <div class="contact__glow contact__glow--1" aria-hidden="true"></div>
                <div class="contact__glow contact__glow--2" aria-hidden="true"></div>
                <div class="contact__content">
                    <span class="contact__badge"></span>
                    <h2 class="contact__title"></h2>
                    <p class="contact__description"></p>
                    <div class="contact__social-links">
                        <a href="#" target="_blank" rel="noopener noreferrer" class="button button--secondary" id="socialWhatsapp">
                            <svg width="1.25rem" height="1.25rem" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                            </svg>
                            <span id="socialWhatsappText"></span>
                        </a>
                        <a href="#" target="_blank" rel="noopener noreferrer" class="button button--secondary" id="socialLinkedin">
                            <svg width="1.25rem" height="1.25rem" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                            </svg>
                            <span id="socialLinkedinText"></span>
                        </a>
                    </div>
                    <form class="contact__form" id="inlineContactForm">
                        <div class="contact__row">
                            <div class="contact__field contact__field--half">
                                <label for="userEmail" class="contact__label" id="labelUserEmail"></label>
                                <input type="email" id="userEmail" class="contact__input" placeholder="" required aria-label="">
                                <div class="contact__input-glow" aria-hidden="true"></div>
                            </div>
                            <div class="contact__field contact__field--half">
                                <label for="userPhone" class="contact__label" id="labelUserPhone"></label>
                                <input type="tel" id="userPhone" class="contact__input" placeholder="" required aria-label="">
                                <div class="contact__input-glow" aria-hidden="true"></div>
                            </div>
                        </div>

                        <div class="contact__field contact__field--full">
                            <label for="userMessage" class="contact__label" id="labelUserMessage"></label>
                            <textarea id="userMessage" class="contact__input contact__textarea" placeholder="" rows="3" required aria-label=""></textarea>
                            <div class="contact__input-glow" aria-hidden="true"></div>
                        </div>
                        <div id="toastNotification" class="toast-notification" aria-hidden="polite">
                            <div class="toast-notification__content">
                                <div class="toast-notification__indicator" aria-hidden="true"></div>
                                <p id="toastMessageText"></p>
                            </div>
                        </div>

                        <button id="contactSubmitButton" type="submit" class="button button--primary button--glow contact__submit" aria-label="">
                            <span id="contactSubmitText"></span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </form>
                </div>
                <div id="customPopupModal" class="popup-modal" aria-hidden="true">
                    <div class="surface-card popup-modal__card">
                        <p id="popupMessageText" class="popup-modal__text"></p>
                        <button type="button" id="closePopupButton" class="button button--primary button--glow popup-modal__button"></button>
                    </div>
                </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__divider" aria-hidden="true">
            <div class="footer__divider-line"></div>
            <div class="footer__divider-node"></div>
        </div>
        <div class="layout-container">
            <div class="footer__grid">
                <div class="footer__brand">
                    <a href="#" id="logoLinkFooter" class="footer__logo" aria-label="">
                        <img id="logoImgFooter" src="images/logo.webp"
                        alt=""
                        class="footer__logo-img"
                        width="48" height="64">
                        <span class="footer__logo-text" id="brandNameFooter"></span>
                    </a>
                    <p class="footer__text" id="footerBrandDescription"></p>
                    <img id="themeIllustration"
                    src=""
                    alt=""
                    class="footer__image"
                    loading="lazy"
                    width="320"
                    height="220">
                </div>
                <div  class="footer__col">
                    <div class="footer__group">
                        <h3 class="footer__heading" id="footerGroupHeadingSolutions"></h3>
                        <ul class="footer__list" id="footerListSolutions"></ul>
                    </div>
                    <div class="footer__group">
                        <h3 class="footer__heading" id="footerGroupHeadingServices"></h3>
                        <ul class="footer__list" id="footerListServices"></ul>
                    </div>
                </div>
                <div class="footer__col">
                    <div class="footer__group">
                        <h3 class="footer__heading" id="footerGroupHeadingExpertise"></h3>
                        <ul class="footer__list" id="footerListExpertise"></ul>
                    </div>

                    <div class="footer__group">
                        <h3 class="footer__heading" id="footerGroupHeadingCapabilities"></h3>
                        <ul class="footer__list" id="footerListCapabilities"></ul>
                    </div>
                </div>
                <div class="footer__col">
                    <div class="footer__group">
                        <h3 class="footer__heading" id="footerGroupHeadingContactInfo"></h3>
                        <ul class="footer__list" id="footerListContactInfo"></ul>
                    </div>

                    <div class="footer__group">
                        <h3 class="footer__heading" id="footerGroupHeadingWorkingHours"></h3>
                        <ul class="footer__list" id="footerListWorkingHours"></ul>
                    </div>
                </div>
            </div>
            <div class="footer__bottom">
                <p><span id="footerCopyright"></span></p>
            </div>
        </div>
    </footer>
</body>
</html>
